# Serves the built SPA and proxies API calls to the Spring Cloud Gateway container.
# Same idea as the Vite dev proxy: the browser sees a single origin, so no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; lets nginx start even if api-gateway isn't up yet
    # and re-resolve it if the container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;

    # Common proxy headers so the gateway/services see the real client + scheme.
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;   # includes the port, e.g. localhost:3000
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;

    location /api/ {
        # With a variable in proxy_pass nginx forwards the original URI unchanged.
        proxy_pass $gateway;
    }

    location /.well-known/ {
        proxy_pass $gateway;
    }

    # Hashed build assets never change -> cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: any unknown path (e.g. /applications/123) gets index.html
    # and react-router resolves the route client-side.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

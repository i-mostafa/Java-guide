server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework   # trust X-Forwarded-* from the gateway (correct Location/links)          # finish in-flight requests on SIGTERM

spring:
  application:
    name: auth-service        # also the Eureka service id and the config-server file name
  config:
    # Pull shared config from config-server; "optional:" = still start if it's down (local dev).
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: ${DB_USERNAME:homefin}
    password: ${DB_PASSWORD:homefin}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

app:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: homefin-api
    access-token-ttl: 15m
  bootstrap-admin:
    enabled: true
    email: ${ADMIN_EMAIL:admin@homefin.local}
    password: ${ADMIN_PASSWORD:Admin#12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.homefin: DEBUG
    org.hibernate.SQL: INFO   # set to DEBUG to see generated SQL

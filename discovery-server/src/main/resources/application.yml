# Local settings of the Eureka discovery server (read automatically by Spring Boot at startup).

server:
  # 8761 is Eureka's conventional port; the dashboard is served at http://localhost:8761
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    # This app IS the registry, so switch off the client side that every other service uses.
    register-with-eureka: false   # the registry does not register with itself
    fetch-registry: false
  server:
    enable-self-preservation: false   # dev only: evict dead instances quickly
    # (self-preservation normally keeps stale entries when many heartbeats are missed at once)

# Expose only health and info under /actuator (used for the docker compose healthcheck).
management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false   # the registry does not register with itself
    fetch-registry: false
  server:
    enable-self-preservation: false   # dev only: evict dead instances quickly

management:
  endpoints:
    web:
      exposure:
        include: health,info

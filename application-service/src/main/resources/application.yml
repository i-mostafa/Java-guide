# Main configuration of application-service, read by Spring Boot at startup.
# Think of it as a typed .env + config.ts in one file. Nested keys form dotted names:
# server.port, spring.datasource.url, app.finance.annual-profit-rate ...
#
# ${VAR:default} is a placeholder: use the environment variable / system property VAR if set, otherwise
# "default" - like process.env.VAR ?? 'default'. Any key can also be overridden without placeholders, e.g. the
# env var SERVER_PORT=9000 overrides server.port ("relaxed binding").
# Profile files such as application-test.yml are layered on top when that profile is active.

server:
  port: 8083                            # HTTP port of the embedded Tomcat (app.listen(8083))
  shutdown: graceful                    # on SIGTERM, stop accepting requests and let in-flight ones finish
  forward-headers-strategy: framework   # trust X-Forwarded-* from the gateway (correct Location/links)

spring:
  application:
    name: application-service           # service id: registered in Eureka, used by the config server and in logs
  config:
    # Also load config from the central Spring Cloud Config Server. "optional:" = start anyway if it's down.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:                           # JDBC connection to Postgres (a pooled connection, HikariCP by default)
    url: jdbc:postgresql://localhost:5432/applicationdb
    username: ${DB_USERNAME:homefin}
    password: ${DB_PASSWORD:homefin}
  jpa:
    # false = don't keep the DB session open while rendering the HTTP response; forces all data loading
    # to happen inside the service layer (avoids hidden lazy-loading queries).
    open-in-view: false
    hibernate:
      # validate = on startup check that entities match the tables and fail if not. The schema itself is
      # owned by Flyway (db/migration), never auto-generated by Hibernate.
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100              # cap ?size= so a client can't request a million rows
  security:
    oauth2:
      resourceserver:
        jwt:
          # Public keys (JWKS) of auth-service used to verify JWT signatures; fetched and cached.
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:http://localhost:8081}   # the token's "iss" claim must equal this
          audiences: homefin-api                            # the token's "aud" claim must contain this
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer             # message key -> bytes
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer      # event object -> JSON
      acks: all                         # a send succeeds only once all in-sync replicas have the message
  cloud:
    openfeign:
      client:
        config:
          default:                      # applies to every Feign client (a client name here would override)
            connect-timeout: 2000       # ms to establish the TCP connection
            read-timeout: 3000          # ms to wait for the response
            logger-level: basic         # log method, URL, status and duration (needs the DEBUG level below)

# "app.*" is our own namespace, bound into the FinanceProperties / ValuationProperties records.
app:
  finance:
    annual-profit-rate: 0.0499          # 4.99% per year
    max-finance-to-value: 0.80          # lend at most 80% of the property value
  valuation:
    base-url: ${VALUATION_BASE_URL:http://localhost:9090}
    api-key: ${VALUATION_API_KEY:local-dev-key}        # real key comes from env/secret store, never committed
    connect-timeout: 2s                 # converted to java.time.Duration
    read-timeout: 3s

# Resilience4j settings for the @Retry / @CircuitBreaker annotations. "instances.<name>" matches the
# name = "..." attribute in the annotation.
resilience4j:
  retry:
    instances:
      valuation:
        max-attempts: 3                 # 1 initial call + up to 2 retries
        wait-duration: 300ms            # wait before the first retry
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2   # waits of 300ms, then 600ms
        retry-exceptions:               # ONLY these exception types trigger a retry (transient failures)
          - com.homefin.application.valuation.ValuationProviderException   # provider answered 5xx
          - org.springframework.web.client.ResourceAccessException         # timeout / connection refused
  circuitbreaker:
    configs:
      default:                          # a reusable template, referenced via base-config below
        sliding-window-size: 10         # judge health on the last 10 calls
        minimum-number-of-calls: 5      # don't open before at least 5 calls were recorded
        failure-rate-threshold: 50      # open the circuit when >= 50% of those calls failed
        wait-duration-in-open-state: 30s    # while OPEN, fail fast (no remote call) for 30s
        permitted-number-of-calls-in-half-open-state: 2   # then let 2 trial calls through to test recovery
        ignore-exceptions:              # business errors are not outages: don't count them as failures
          - com.homefin.common.error.BusinessRuleException
    instances:
      valuation:
        base-config: default
      customer-service:
        base-config: default

management:                             # Spring Boot Actuator (ops endpoints)
  endpoints:
    web:
      exposure:
        # Which /actuator/* endpoints are reachable over HTTP (the rest stay internal).
        include: health,info,metrics,prometheus,circuitbreakers

logging:
  level:                                # log level per package/class (like a namespace filter in pino/debug)
    com.homefin: DEBUG
    com.homefin.application.customer.CustomerClient: DEBUG   # Feign logs at DEBUG level

# Local environment.
#   Infrastructure only (run services from your IDE):  docker compose up -d
#   Everything in containers:                          docker compose --profile apps up -d --build
name: homefin

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: docker
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  JWT_ISSUER: http://auth-service:8081
  DB_USERNAME: ${POSTGRES_USER:-homefin}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-homefin}

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homefin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homefin}
      POSTGRES_DB: homefin
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1          # KRaft mode - no ZooKeeper needed
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT = for other containers (kafka:19092), PLAINTEXT_HOST = for your laptop (localhost:9092)
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on: [kafka]

  wiremock:                            # fake 3rd-party APIs (KYC + property valuation)
    image: wiremock/wiremock:3.13.1
    ports: ["9090:8080"]
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./infra/wiremock/mappings:/home/wiremock/mappings:ro

  jaeger:                              # distributed tracing UI -> http://localhost:16686
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
      - "4318:4318"                    # OTLP over HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ------------------------------------------------------------------ platform services
  config-server:
    profiles: [apps]
    build: { context: ., args: { MODULE: config-server } }
    ports: ["8888:8888"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8888"]
      interval: 5s
      retries: 30

  discovery-server:
    profiles: [apps]
    build: { context: ., args: { MODULE: discovery-server } }
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8761"]
      interval: 5s
      retries: 30

  api-gateway:
    profiles: [apps]
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["8080:8080"]
    environment: *app-env
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  # ------------------------------------------------------------------ business services
  auth-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: auth-service } }
    ports: ["8081:8081"]
    environment:
      <<: *app-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@homefin.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin#12345}
    depends_on: &svc-deps
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  customer-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: customer-service } }
    ports: ["8082:8082"]
    environment:
      <<: *app-env
      KYC_API_KEY: ${KYC_API_KEY:-local-dev-key}
    depends_on: *svc-deps

  application-service:
    profiles: [apps]
    build: { context: ., args: { MODULE: application-service } }
    ports: ["8083:8083"]
    environment:
      <<: *app-env
      VALUATION_API_KEY: ${VALUATION_API_KEY:-local-dev-key}
    depends_on: *svc-deps

volumes:
  pgdata:
